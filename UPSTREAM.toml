# The upstream package this repository carries under its own name, the release it was admitted at, and the patches
# carried on top of it. The commit guard (.githooks/pre-commit) and tools/family-scope.sh read [upstream] commit and
# name and [package] name: the paths upstream's tree at that commit holds, the package's name in a path mapped back
# to upstream's, keep upstream's style; every other path is the family's.

[upstream]
name = "DoubleFloats"
uuid = "497a8b3b-efae-58df-a0af-a86822472b78"
url = "https://github.com/JuliaMath/DoubleFloats.jl"
license = "MIT"
tag = "v1.12.0"
# the annotated tag object, fetched here as refs/tags/upstream/v1.12.0
tag_object = "c84914163eefde0c685560c3f8c5526c5dd3de49"
commit = "60b72cae8a53577c170afab0d48a011a853d1a96"
# the commit's git tree, equal to the git-tree-sha1 the General registry records for DoubleFloats 1.12.0
tree = "00720e467f998dc28d6bd3ec2fe33b1d04155f6c"

[package]
name = "DoubleFloatsX"
uuid = "949356e3-18ca-4f00-99f2-e8b6fcaa5048"

# One row per change carried on top of upstream, its id the README's "Differences from upstream" row
[[patch]]
id = "DFX-001"
summary = "the package renamed DoubleFloatsX with its own UUID and this repository as its repo; its module and qualifications renamed; the exported type names upstream's"

[[patch]]
id = "DFX-002"
summary = "conversion to Int8..Int128 and UInt8..UInt128 (constructor, convert, Integer, Signed, Unsigned) exact or InexactError, of the target type, computed on the limbs without allocating; round, floor, ceil and trunc to every fixed-width type decided on the limbs, never rounded in the float type first"

[[patch]]
id = "DFX-003"
summary = "floor, ceil and trunc exact: an integer's zero low limb no longer counted as fractional, a fractional low limb added to the high limb exactly; the Double64 and Double32 floatmin2 constants recomputed with them"

[[patch]]
id = "DFX-004"
summary = "round and RoundNearest tie to even, RoundNearestTiesAway and RoundNearestTiesUp exact, each decided on the limbs"

[[patch]]
id = "DFX-005"
summary = "loggamma(::Complex{Double64}) on the continuous branch, allocation-free, within 16 units of 2^-106 of max(1, |lg|) per part against Arb, in SpecialFunctions and, through the Gamma extension, Gamma.jl; Gamma.gamma, Gamma.loggamma and Gamma.logabsgamma of a Double64"
